                description: Revenue amount in minor currency units. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
                example: 200000
              count:
                type: integer
                example: 11
        clientProviders:
          type: array
          description: Client providers available for this payment link.
          items:
            type: object
            properties:
              provider:
