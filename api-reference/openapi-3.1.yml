openapi: 3.1.0
info:
  title: Payfonte - OpenAPI 3.1
  description: |-
    This is the minimal API for payfonte collection and disbursements API. To view a more elaborate documentation see here.

    Some useful links:
    - [Home](https://payfonte.com)
    - [Payfonte Documentation](https://docs.payfonte.com)

  termsOfService: https://www.payfonte.com/terms
  contact:
    email: tech@payfonte.com
  version: 1.0.0
servers:
  - url: https://sandbox-api.payfonte.com
    description: Sandbox API Base URL
  - url: https://api.payfonte.com
    description: Production API Base URL

tags:
  - name: Collections
    description: Everything about your payment collection with payfonte
    externalDocs:
      description: Find out more
      url: https://docs.payfonte.com/#/collections/inline
  - name: Card Collections
    description: Everything about your card payment collections with payfonte
  - name: Payment Links
    description: Create and manage shareable payment links for hosted customer payments.
  - name: Disbursements
    description: |
      Find full list of supported Disbursement providers here [Supported Providers](https://docs.payfonte.com/#/Disbursements/supported-Disbursements)
      There are 3 main process to carry out a Disbursement on Payfonte
      1. Validate A transfer Recipient
      2. Initiate a Disbursement Request
      3. Verify a Disbursement Request
  - name: Wallets
    description: A Little bit about our [wallets here] (https://docs.payfonte.com/#/introductions/wallets)

paths:
  /payments/v1/payments/direct-charge:
    post:
      tags:
        - Collections
      summary: Collection API - Direct
      description: Charge the Customer via API
      operationId: DirectChargeAPI
      requestBody:
        content:
          application/json:
            schema:
              $ref:  '#/components/schemas/DirectChargeAPIRequest'
        required: true
      responses:
        '201':
          description: "Request Submitted Successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DirectChargeAPIResponse'
  /payments/v1/payments/confirm:
    post:
      tags:
        - Collections
      summary: Confirm Direct Charge Customer Input
      description: Submit customer input, such as an OTP, when a Direct Charge response returns `action` as `otp`.
      operationId: confirmDirectChargeCustomerInput
      requestBody:
        description: Direct Charge customer input confirmation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectChargeConfirmRequest'
            example:
              reference: "DDC20260702112401ZIWGF"
              customerInput:
                otp: "445985"
        required: true
      responses:
        '201':
          description: Customer input accepted and payment confirmation is processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChargeConfirmEnvelope'
              example:
                statusCode: 201
                data:
                  action: "processing"
                  sessionId: "cos-1z3x983b01300"
                  provider: "qmoney-gambia"
                  reference: "DDC20260702115234PTIFG"
                  providersReference: "PIX_44241170102532681668"
                  amount: 1000
                  totalAmount: 1000
                  charge: 0
                  status: "pending"
                  data:
                    message: "OTP submitted successfully. Payment confirmation is processing."
                  statusDescription: "Awaiting Provider's Feedback"
  /payments/v1/cards/process:
    post:
      tags:
        - Card Collections
      summary: Submit Card Details
      description: Submit customer card details to start a card payment. Sandbox card test data is available in [Testing](https://docs.payfonte.com/en/guides/introductions/testing#card-test-details).
      operationId: submitCardDetails
      requestBody:
        description: Card payment request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentProcessRequest'
            example:
              reference: "ORDER-1001"
              provider: "card-nigeria"
              amount: 50000
              redirectURL: "https://yourapp.com/payment/complete"
              webhook: "https://yourapp.com/webhooks/payfonte"
              card:
                pan: "5061 4604 1012 1111 102"
                expiry:
                  month: "12"
                  year: "2050"
                cvv: "558"
                cardHolderName: "Emily Heidenreich-Kohler"
                email: "Darrick.OHara@hotmail.com"
                phoneNumber: "(536) 393-0857"
                address: "Address 1, Lokoja"
                city: "my-city"
        required: true
      responses:
        '200':
          description: Card payment requires the customer PIN or verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                pin:
                  summary: PIN required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "pin"
                      data: {}
                verification:
                  summary: Verification required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "verification"
                      data: {}
        '201':
          description: Card payment requires OTP or 3DS redirect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                otp:
                  summary: OTP required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "otp"
                      data: {}
                redirect:
                  summary: 3DS redirect required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701144120NCDZW"
                      action: "redirect"
                      data:
                        redirectURL: "https://s.6bd.co/card-3ds/mce1aN"
  /payments/v1/cards/pin:
    post:
      tags:
        - Card Collections
      summary: Submit Card PIN
      description: Submit the card PIN when a card payment response returns `action` as `pin`. Sandbox card test data is available in [Testing](https://docs.payfonte.com/en/guides/introductions/testing#card-test-details).
      operationId: submitCardPin
      requestBody:
        description: Card PIN request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentPinRequest'
            example:
              reference: "DCD20260701144120NCDZW"
              provider: "card-nigeria"
              card:
                pan: "5061 4604 1012 1111 106"
                expiry:
                  month: "12"
                  year: "2050"
                cvv: "562"
                pin: "1106"
                cardHolderName: "Donna Flatley"
                email: "Darrick.OHara@hotmail.com"
                phoneNumber: "(536) 393-0857"
                address: "Address 1, Lokoja"
                city: "my-city"
        required: true
      responses:
        '200':
          description: Card payment requires the next customer action or verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                pin:
                  summary: PIN required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "pin"
                      data: {}
                verification:
                  summary: Verification required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "verification"
                      data: {}
        '201':
          description: Card payment requires the next customer action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                otp:
                  summary: OTP required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "otp"
                      data: {}
                redirect:
                  summary: 3DS redirect required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701144120NCDZW"
                      action: "redirect"
                      data:
                        redirectURL: "https://s.6bd.co/card-3ds/mce1aN"
  /payments/v1/cards/otp:
    post:
      tags:
        - Card Collections
      summary: Submit Card OTP
      description: Submit the customer OTP when a card payment response returns `action` as `otp`. Sandbox card test data is available in [Testing](https://docs.payfonte.com/en/guides/introductions/testing#card-test-details).
      operationId: submitCardOtp
      requestBody:
        description: Card OTP request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentOtpRequest'
            example:
              reference: "DCD20260701144120NCDZW"
              otp: "543210"
        required: true
      responses:
        '200':
          description: Card payment requires the next customer action or verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                pin:
                  summary: PIN required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "pin"
                      data: {}
                verification:
                  summary: Verification required
                  value:
                    statusCode: 200
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "verification"
                      data: {}
        '201':
          description: Card payment requires the next customer action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentActionEnvelope'
              examples:
                otp:
                  summary: OTP required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701133425EIQWF"
                      action: "otp"
                      data: {}
                redirect:
                  summary: 3DS redirect required
                  value:
                    statusCode: 201
                    data:
                      reference: "DCD20260701144120NCDZW"
                      action: "redirect"
                      data:
                        redirectURL: "https://s.6bd.co/card-3ds/mce1aN"
  /payments/v1/payment-links:
    post:
      tags:
        - Payment Links
      summary: Create Payment Link
      description: Create a shareable payment link that customers can use to complete payment through hosted checkout.
      operationId: createPaymentLink
      requestBody:
        description: Payment link creation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
            example:
              isAmountFixed: false
              title: "decimal test"
              description: "demo"
              redirectURL: ""
              logo: "https://6thbridge-file-upload.s3.amazonaws.com/choosen-02.png"
              customFields: []
              maximumAmount: 100000000
              minimumAmount: 0
              amountLimit: 100000000
              currency: "XOF"
              country: "CI"
        required: true
      responses:
        '201':
          description: Payment link created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkEnvelope'
              example:
                statusCode: 201
                data:
                  clientId: "6thbridge"
                  locale: "en"
                  logo: "https://6thbridge-file-upload.s3.amazonaws.com/choosen-02.png"
                  currency: "XOF"
                  country: "CI"
                  title: "decimal test"
                  description: "demo"
                  isAmountFixed: false
                  longURL: "https://checkout-staging.6thbridge.com/link/6a7a2093b9e24880f73a80b0"
                  shortURL: "https://s.6bd.co/payment-link/1PIDcH"
                  minimumAmount: 0
                  maximumAmount: 100000000
                  amountLimit: 100000000
                  customFields: []
                  redirectURL: ""
                  expiresAt: null
                  isActive: true
                  status: "active"
                  parentClientId: "6thbridge"
                  createdAt: "2026-08-10T19:03:47.222Z"
                  updatedAt: "2026-08-10T19:03:47.222Z"
                  id: "6a7a2093b9e24880f73a80b0"
    get:
      tags:
        - Payment Links
      summary: Fetch All Payment Links
      description: Retrieve a paginated list of payment links.
      operationId: getPaymentLinks
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
