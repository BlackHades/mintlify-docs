  /payments/v1/payments/verify/{reference}:
    get:
      tags:
        - Collections
      summary: Verify Collection (TSQ)
      description: This is the endpoint to verify a Transaction (TSQ)
      operationId: verifyPaymentTransaction
      parameters:
        - in: path
          name: reference
          schema:
            type: string
          required: true
          description: Reference of the transaction to verify
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VerifyTransactionResponse'
  /payments/v1/payments:
    get:
      tags:
        - Collections
      summary: Fetch Collection History
      description: Retrieve a paginated list of all collection transactions
      operationId: getAllCheckouts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 4
          description: Number of records per page
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
            example: "2024-01-01"
          description: Start date for filtering transactions (inclusive)
          required: false
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
            example: "2025-01-01"
          description: End date for filtering transactions (inclusive)
          required: false

      responses:
        '200':
          description: Successfully retrieved transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCheckoutResponse'

  /payments/v1/checkouts:
    post:
      tags:
        - Collections
      summary: Collections API - Generate Checkout
      description: Generate a Payment Checkout URL for customers to make payment
      operationId: generateCheckoutURL
      requestBody:
        description: Generate A Payment Checkout URL
        content:
          application/json:
            schema:
              $ref:  '#/components/schemas/GenerateCheckoutURLRequest'
        required: true
      responses:
        '201':
          description: "Checkout URL Successfully Generated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GenerateCheckoutURLResponse'
  /payments/v1/payments/direct-charge/{provider}/properties:
    get:
      tags:
        - Collections
      summary: Fetch Provider Properties
      description: This is the endpoint to Fetch properties for provider that needs them Direct charge API can be called. E.g Pawapay
      operationId: fetchDirectChargeProviderProperties
      parameters:
        - in: path
          name: provider
          schema:
            type: string
          required: true
          description: This is the provider slug. Find full list of providers here [Supported Providers](https://docs.payfonte.com/#/collections/direct-charge/supported-providers)
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/DirectChargeProviderPawapayPropertiesResponse'

  /billing/v1/transfer-recipients/{provider}/properties:
    get:
      tags:
        - Disbursements
      summary: Fetch Provider Properties
      description: This is the endpoint to Fetch properties for provider that needs them before a transfer recipient can be created. E.g Paystack (Bank Transfer)
      operationId: fetchTransferRecipientProviderProperties
      parameters:
        - in: path
          name: provider
          schema:
            type: string
          required: true
          description: This is the provider slug. Find full list of providers here [Supported Providers](https://docs.payfonte.com/#/Disbursements/supported-Disbursements)
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TransferRecipientProviderBankListResponse'
                      - $ref: '#/components/schemas/TransferRecipientProviderPawapayPropertiesResponse'
  /billing/v1/transfer-recipients/validate:
    post:
      tags:
        - Disbursements
      summary: Validate A Transfer Recipient
      description: Create and Validate a Transfer Recipient for Disbursements
      operationId: validateTransferRecipient
      requestBody:
        description: Validate a Transfer Recipient
        content:
          application/json:
            schema:
              $ref:  '#/components/schemas/ValidateTransferRecipientRequest'
        required: true
      responses:
        '201':
          description: "Transfer Recipient Successfully Validated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ValidateTransferRecipientResponse'
  /billing/v1/disbursements:
    post:
      tags:
        - Disbursements
      summary: Request a Disbursement
      description: Request a Disbursement to a Transfer Recipient
      operationId: RequestADisbursement
      requestBody:
        description: Request a Disbursement
        content:
          application/json:
            schema:
              $ref:  '#/components/schemas/RequestDisbursementRequest'
        required: true
      responses:
        '201':
          description: "Request for Disbursement Successful"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RequestDisbursementResponse'
    get:
      tags:
        - Disbursements
      summary: Fetch All Disbursements Transaction
      description: Retrieve a paginated list of all disbursement transactions
      operationId: getAllDisbursements
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
            example: "2025-01-01"
          description: Start date for filtering transactions (inclusive)
          required: false
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
            example: "2025-03-31"
          description: End date for filtering transactions (inclusive)
          required: false
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 4
          description: Number of records per page
      responses:
        '200':
          description: Successfully retrieved disbursements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDisbursements'

  /billing/v1/disbursements/verify/{reference}:
    get:
      tags:
        - Disbursements
      summary: Verify a Disbursement
      description: Verify a Disbursement
      operationId: VerifyADisbursement
      parameters:
        - in: path
          name: reference
          schema:
            type: string
          required: true
          description: Reference of the transaction to verify
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VerifyDisbursementTransactionResponse'
  /billing/v1/wallets:
    get:
      tags:
        - Wallet
      summary: Fetch Wallets
      description: This is the endpoint to Fetch Wallet for a business
      operationId: fetchWallets
      parameters:
        - in: query
          name: country
          schema:
            $ref: "#/components/schemas/Country"
        - in: query
          name: currency
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      $ref: "#/components/schemas/WalletBalanceResponse"

components:
  schemas:
    Amount:
      type: integer
      description: Amount should be in the subunit of the supported currency i.e value * 100. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
      format: int64
      example: 100000
      examples:
        - 100000

    Currency:
      type: string
      description: 3 character currency code
      example: USD, NGN, XOF, XAF
      examples:
        - NGN
        - USD
        - XOF
        - XAF
    Country:
      type: string
      description: 2 character country code
      example: US, NG, CI, SN, CA, UK
      examples:
        - NG
        - US
        - CI
        - SN
        - CA
        - UK
    Provider:
      type: string
      description: This is the provider we are validating the account against. Find full list of providers here [Supported Providers](https://docs.payfonte.com/#/Disbursements/supported-Disbursements)
      examples:
        - provider-slug
    User:
      type: object
      properties:
        name:
          type: string
          description: customer's name
          example: "Example User"
          examples:
            - "Example User"
        email:
          type: string
          description: customer's email
          example: "user@example.com"
          format: email
          examples:
            - "user@example.com"
        phoneNumber:
          type: string
          description: customer's phone number
          example: "2347012345678"
          examples:
            - "2347012345678"
    Metadata:
      type: object
      properties:
        merchantName:
          type: string
          example: "Karis Clothing"
          examples:
            - "Karis Clothing"
        trafficType:
          type: string
          example: "ECOMMERCE"
          examples:
            - "ECOMMERCE"

    GenerateCheckoutURLRequest:
      required:
        - country
        - currency
        - user
        - amount
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
          examples:
            - NG
        currency:
          $ref: '#/components/schemas/Currency'
          description: This is the base currency to be charged in.
          examples:
            - NGN
        amount:
          $ref: '#/components/schemas/Amount'
          description: This is the amount to charge the customer. Amount should be sent in the lowest denomination e.g for 100 USD you should send 100 * 100 = 10000. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          examples:
            - 10000
        user:
          $ref: '#/components/schemas/User'
          required:
            - phoneNumber
        reference:
          type: string
          description: A reference code you'll generate to identify this transaction. This must be unique for every transaction. If you don't pass one, we will generate one for you.
        redirectURL:
          type: string
          format: uri
          description: "Fully qualified URL to which the customer should be redirected after the payment is completed"
          example: 'https://example.com/redirect/success'
          examples:
            - 'https://example.com/redirect/success'
        cancelURL:
          type: string
          format: uri
          description: "Fully qualified URL to which the customer should be redirected if the cancel the payment session"
          example: 'https://example.com/redirect/cancel'
          examples:
            - 'https://example.com/redirect/cancel'
        webhook:
          type: string
          format: uri
          description: 'This is a URL, if this is passed we will send the event webhook payload to this endpoint. Use this to override the webhook url provided on the dashboard for this transaction. Read more on [Webhooks](https://docs.payfonte.com/#/collections/webhook)'
          example: 'https://example.com/webhook'
          examples:
            - 'https://example.com/webhook'
        metadata:
          $ref: '#/components/schemas/Metadata'
    DirectChargeAPIRequest:
      required:
        - provider
        - amount
        - customerInput
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
          description: This is the provider we are routing the request through. Find full list of providers here [Supported Providers](https://docs.payfonte.com/#/collections/direct-charge/supported-providers)
          examples:
            - airtel-smartcash-ng
            - mtn-momo-ivory-coast
        amount:
          $ref: '#/components/schemas/Amount'
          description: Amount should be sent in the lowest denomination e.g for 100 USD you should send 100 * 100 = 10000. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
        reference:
          type: string
          description: A reference code you'll generate to identify this transaction. This must be unique for every transaction. If you don't pass one, we will generate one for you.
        customerInput:
          type: object
          properties:
            phoneNumber:
              type: string
              description: customer's phone number
              example: "2347012345678"
              examples:
                - "2347012345678"
        redirectURL:
          type: string
          format: uri
          description: "Fully qualified URL to which the customer should be redirected after the payment is completed"
          example: 'https://example.com/redirect/success'
          examples:
            - 'https://example.com/redirect/success'
        webhook:
          type: string
          format: uri
          description: 'This is a URL, if this is passed we will send the event webhook payload to this endpoint. Use this to override the webhook url provided on the dashboard for this transaction. Read more on [Webhooks](https://docs.payfonte.com/#/collections/webhook)'
          example: 'https://example.com/webhook'
          examples:
            - 'https://example.com/webhook'
        metadata:
          $ref: '#/components/schemas/Metadata'

    CardPaymentExpiry:
      required:
        - month
        - year
      type: object
      properties:
        month:
          type: string
          description: Two-digit card expiry month.
          example: "12"
        year:
          type: string
          description: Four-digit card expiry year.
          example: "2050"
    CardPaymentCard:
      required:
        - pan
        - expiry
        - cvv
        - cardHolderName
        - email
        - phoneNumber
        - address
        - city
      type: object
      properties:
        pan:
          type: string
          description: Card primary account number.
          example: "5061 4604 1012 1111 102"
        expiry:
          $ref: '#/components/schemas/CardPaymentExpiry'
        cvv:
          type: string
          description: Card security code.
          example: "558"
        cardHolderName:
          type: string
          description: Name printed on the card.
          example: "Emily Heidenreich-Kohler"
        email:
          type: string
          format: email
          description: Customer email address.
          example: "Darrick.OHara@hotmail.com"
        phoneNumber:
          type: string
          description: Customer phone number.
          example: "(536) 393-0857"
        address:
          type: string
          description: Customer billing address.
          example: "Address 1, Lokoja"
        city:
          type: string
          description: Customer city.
          example: "my-city"
    CardPaymentPinCard:
      allOf:
        - $ref: '#/components/schemas/CardPaymentCard'
        - required:
            - pin
          type: object
          properties:
            pin:
              type: string
              description: Card PIN required to continue the transaction.
              example: "1106"
    CardPaymentProcessRequest:
      required:
        - provider
        - amount
        - card
      type: object
      properties:
        reference:
          type: string
          description: A reference code you'll generate to identify this transaction. This must be unique for every transaction. If you don't pass one, we will generate one for you.
          example: "ORDER-1001"
        provider:
          type: string
          description: Card provider slug.
          example: "card-nigeria"
        amount:
          $ref: '#/components/schemas/Amount'
          description: Amount should be sent in the lowest denomination. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 50000
        redirectURL:
          type: string
          format: uri
          description: Fully qualified URL to which the customer should be redirected after the payment is completed.
          example: "https://yourapp.com/payment/complete"
        webhook:
          type: string
          format: uri
          description: This is a URL, if this is passed we will send the event webhook payload to this endpoint. Use this to override the webhook url provided on the dashboard for this transaction.
          example: "https://yourapp.com/webhooks/payfonte"
        card:
          $ref: '#/components/schemas/CardPaymentCard'
    CardPaymentPinRequest:
      required:
        - reference
        - provider
        - card
      type: object
      properties:
        reference:
          type: string
          description: Card payment reference returned by the previous card payment step.
          example: "DCD20260701144120NCDZW"
        provider:
          type: string
          description: Card provider slug.
          example: "card-nigeria"
        card:
          $ref: '#/components/schemas/CardPaymentPinCard'
    CardPaymentOtpRequest:
      required:
        - reference
        - otp
      type: object
      properties:
        reference:
          type: string
          description: Card payment reference returned by the previous card payment step.
          example: "DCD20260701144120NCDZW"
        otp:
          type: string
          description: One-time password collected from the customer.
          example: "543210"
    CardPaymentActionData:
      type: object
      properties:
        redirectURL:
          type: string
          format: uri
          description: URL where the customer should complete 3DS authentication when `action` is `redirect`.
          example: "https://s.6bd.co/card-3ds/mce1aN"
    CardPaymentActionResponse:
      required:
        - reference
        - action
        - data
      type: object
      properties:
        reference:
          type: string
          description: Card payment reference to use in the next card step or verification request.
          example: "DCD20260701133425EIQWF"
        action:
          type: string
          description: Next action required to continue or verify the card payment.
          enum:
            - pin
            - otp
            - redirect
            - verification
          example: "pin"
        data:
          $ref: '#/components/schemas/CardPaymentActionData'
    CardPaymentActionEnvelope:
      required:
        - statusCode
        - data
      type: object
      properties:
        statusCode:
          type: integer
          description: Application status code returned in the response body.
          example: 200
        data:
          $ref: '#/components/schemas/CardPaymentActionResponse'

    PaymentLinkCustomField:
      type: object
      description: Extra payer field to collect before creating checkout. Choice fields require `options`.
      additionalProperties: true
      properties:
        label:
          type: string
          description: Payer-facing field label.
          example: "Invoice number"
        name:
          type: string
          description: Machine-readable field name.
          example: "invoiceNumber"
        type:
          type: string
          description: Field input type.
          enum:
            - text
            - paragraph-text
            - dropdown
            - number
            - date
            - file-upload
            - checkbox
          example: "text"
        required:
          type: boolean
          description: Whether the payer must complete this field.
          example: false
        options:
          type: array
          description: Available choices for choice fields.
          items:
            type: string
          example:
            - "Small"
            - "Large"
    CreatePaymentLinkRequest:
      required:
        - title
        - description
        - currency
        - country
      type: object
      properties:
        title:
          type: string
          description: Human-readable payment link title.
          example: "decimal test"
        description:
          type: string
          description: Human-readable payment link description.
          example: "demo"
        logo:
          type: string
          description: Logo URL or empty string. Defaults to the client or business logo.
          example: "https://6thbridge-file-upload.s3.amazonaws.com/choosen-02.png"
        locale:
          type: string
          description: Locale for payer-facing checkout. Defaults to the client or business locale.
          example: "en"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Required 3-letter ISO currency code.
          example: "XOF"
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Required 2-letter ISO country code used for active integration lookup.
          example: "CI"
        isAmountFixed:
          type: boolean
          description: Set to `true` when the payer cannot change the amount.
          example: false
        amount:
          type: number
          description: Fixed collection amount in minor currency units. Required when `isAmountFixed` is `true` and must be greater than zero. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 100000
        minimumAmount:
          type: number
          description: Minimum payer-entered amount in minor currency units. Used when `isAmountFixed` is `false`. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 0
        maximumAmount:
          type: number
          description: Maximum payer-entered amount in minor currency units. Used when `isAmountFixed` is `false`. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 100000000
        amountLimit:
          type: number
          description: Total collectible amount limit across successful payments for this link in minor currency units. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 100000000
        customFields:
          type: array
          description: Extra payer fields to collect before creating checkout.
          items:
            $ref: '#/components/schemas/PaymentLinkCustomField'
          example: []
        redirectURL:
          type: string
          description: URL to redirect the payer to after payment flow.
          example: ""
        isAnonymousPaymentEnabled:
          type: boolean
          description: Whether anonymous payments are allowed.
          example: false
        expiresAt:
          type:
            - string
            - 'null'
          format: date
          description: Date on which the link expires.
          example: "2026-12-31"
    PaymentLink:
      type: object
      properties:
        amount:
          type: number
          description: Fixed amount configured for the payment link in minor currency units, when applicable. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 0
        isAnonymousPaymentEnabled:
          type: boolean
          description: Whether anonymous payments are allowed.
          example: false
        clientId:
          type: string
          description: Client identifier associated with the payment link.
          example: "payfusion"
        locale:
          type: string
          description: Locale for payer-facing checkout.
          example: "en"
        logo:
          type: string
          description: Logo URL displayed on the payment link checkout.
          example: "https://files.6thbridge.xyz/public/v1/files/payfusion/content/6a2fc1603d18ca5a47adbe17"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 3-letter ISO currency code.
          example: "NGN"
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: 2-letter ISO country code used for active integration lookup.
          example: "NG"
        title:
          type: string
          description: Human-readable payment link title.
          example: "kksk"
        description:
          type: string
          description: Human-readable payment link description.
          example: "kksk"
        isAmountFixed:
          type: boolean
          description: Whether the payer can change the payment amount.
          example: false
        longURL:
          type: string
          format: uri
          description: Full payment link URL.
          example: "https://staging-checkout.payfusion.io/link/6a7204a536c2106e38fe8e01"
        shortURL:
          type: string
          format: uri
          description: Short payment link URL.
          example: "https://s.6bd.co/payment-link/bN0ASZ"
        minimumAmount:
          type: number
          description: Minimum payer-entered amount in minor currency units. Used when `isAmountFixed` is `false`. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 0
        maximumAmount:
          type: number
          description: Maximum payer-entered amount in minor currency units. Used when `isAmountFixed` is `false`. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 200000
        amountLimit:
          type: number
          description: Total collectible amount limit across successful payments for this link in minor currency units. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 200000
        customFields:
          type: array
          description: Extra payer fields collected before creating checkout.
          items:
            $ref: '#/components/schemas/PaymentLinkCustomField'
          example: []
        redirectURL:
          type: string
          description: URL to redirect the payer to after payment flow.
          example: "https://staging-checkout.payfusion.io/invoices/summary/6a7204a5580ef8976ef93da8"
        expiresAt:
          type:
            - string
            - 'null'
          format: date
          description: Date on which the link expires.
          example: null
        isActive:
          type: boolean
          description: Whether the payment link is currently active.
          example: true
        status:
          type: string
          description: Current payment link status.
          enum:
            - active
            - completed
            - inactive
            - expired
          example: "active"
        parentClientId:
          type: string
          description: Parent client identifier associated with the payment link.
          example: "payfusion"
        createdAt:
          type: string
          format: date-time
          description: Payment link creation timestamp.
          example: "2026-08-04T11:55:53.054Z"
        updatedAt:
          type: string
          format: date-time
          description: Payment link update timestamp.
          example: "2026-08-04T11:55:53.054Z"
        id:
          type: string
          description: Payment link ID.
          example: "6a71d34936c2106e38fe8a4a"
    PaymentLinkAnalytics:
      type: object
      properties:
        totalTransactionAmount:
          type: number
          description: Total successful transaction amount collected through the payment link in minor currency units. See [Amount Specification](https://docs.payfonte.com/en/guides/introductions/amount-specification).
          example: 200000
        totalTransactionCount:
          type: integer
          description: Total successful transaction count for the payment link.
